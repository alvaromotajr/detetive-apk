<style>

.painel.chat button{background:#1a3d85;color:#fff;border-color:#3b62b8}

<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
"use strict";
const $app = document.getElementById("app");
const CORES = ["#e6e6e6","#e24b4a","#c9a93b","#7fb6d9","#8fc98f","#c28fd9","#e8a06a","#9a9a9a"];

const VERSAO_WEB = "0.10.0";
const S = { convite:null, ativa:null, querAbrir:false, fundo:false, cutucada:null, cutucouEm:0, tema:"escuro", juizSeg:0, tela:"login", aba:"entrar", erro:"", iniciando:true, juizOffline:false, conectado:false, nome:null,
  convidado:false, sala:null, jogo:null, caderno:{}, historico:null, cadernoAberto:false,
  atual:null, atualizando:false, pct:null, erroAtual:"", sel:{suspeito:null, arma:null}, acusando:false, acus:{suspeito:null, local:null, arma:null}, ultimoVi:0, vistoN:null, servico:false, vista3d:false, ang:45, elev:32, zoom:1, foco:null, alvo:null, painel:null, chatLido:0, chatVisto:null, som:true, noite:false, fixo:false, blefe:false, lembrando:false, rolando:0, anim:null, prazo:null, tut:null };
try { S.vista3d = localStorage.getItem("detetive_3d") === "1"; S.som = localStorage.getItem("detetive_som") !== "0"; S.noite = localStorage.getItem("detetive_noite") === "1"; S.fixo = localStorage.getItem("detetive_fixo") === "1"; S.tema = localStorage.getItem("detetive_tema") || "escuro"; } catch(e){}

function guardar(k, v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k, v);}catch(e){} }
function ler(k){ try{ return localStorage.getItem(k);}catch(e){ return null; } }
function esc(t){ return String(t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------------------------------------------------------- conexão (Firebase) */
let T = null;
const configOk = () => window.FIREBASE_CONFIG && !/COLE_AQUI/.test(JSON.stringify(window.FIREBASE_CONFIG));
function armazenar(){
  return { ler: k => ler(k), gravar: (k,v) => guardar(k,v), apagar: k => guardar(k,null) };
}
function conectar(){
  if (window.__enviarFalso) { S.conectado = true; return; }     // modo de teste
  if (!window.firebase || !window.criarNuvem){ S.iniciando = false; S.erro = "Sem internet para carregar o Firebase. Confira a conexão e abra o app de novo."; return; }
  if (!configOk()){ S.iniciando = false; S.erro = "Falta configurar o Firebase (arquivo firebase-config.js). Veja o LEIA-ME."; return; }
  try {
    const nuvem = window.criarNuvem(window.firebase, window.FIREBASE_CONFIG);
    T = window.criarTransporte({ nuvem, Juiz: window.Juiz.Juiz, aoReceber: receber, armazenar: armazenar() });
    S.conectado = true; T.iniciar();
  } catch(e){ S.iniciando = false; S.erro = "Não foi possível iniciar o Firebase."; }
}
const GLOBAIS = ["criar_sala","entrar_sala","historico","registrar","entrar","convidado","retomar","sair_conta","ping"];
function enviar(msg){
  if (S.ativa && !msg._sala && !GLOBAIS.includes(msg.tipo)) msg = Object.assign({}, msg, {_sala:S.ativa});
  if (window.__enviarFalso) return window.__enviarFalso(JSON.stringify(msg));
  if (T) T.enviar(msg); else { S.erro = S.erro || "Ainda sem conexão."; desenhar(); }
}

/* ------------------------------------------- várias salas: cada sala tem a sua "fatia" de estado */
const R = {};
const FATIA = {sala:()=>null, jogo:()=>null, caderno:()=>({}), juizOffline:()=>false, juizSeg:()=>0, vistoN:()=>null, chatVisto:()=>null, chatLido:()=>0, prazo:()=>null, acusando:()=>false, alvo:()=>null, anim:()=>null, foco:()=>null, zoom:()=>1, painel:()=>null, cadernoAberto:()=>false, sel:()=>({suspeito:null, arma:null}), acus:()=>({suspeito:null, local:null, arma:null}), blefe:()=>false, lembrando:()=>false, cutucada:()=>null, cutucouEm:()=>0};
function salvarFatia(){ if (!S.ativa) return; const f = R[S.ativa] || (R[S.ativa] = {}); for (const k in FATIA) f[k] = S[k]; }
function carregarFatia(c){ const f = (c && R[c]) || {}; for (const k in FATIA) S[k] = (k in f) ? f[k] : FATIA[k](); }
function telaDaSala(){ return S.sala ? (S.sala.iniciada ? "jogo" : "lobby") : "menu"; }
function abrirSala(c){
  if (!R[c]) return; salvarFatia(); S.ativa = c; carregarFatia(c); S.tela = telaDaSala(); S.erro = ""; S.querAbrir = false; S.prazo = S.sala && S.sala.restam != null ? Date.now() + S.sala.restam * 1000 : S.prazo;
  agendarLembrete(); desenhar();
}
function irInicio(){ salvarFatia(); S.ativa = null; carregarFatia(null); S.tela = "menu"; S.erro = ""; desenhar(); }
function sairDaSala(c, confirmar){
  const f = R[c], dono = f && f.sala && f.sala.anfitriao === S.nome;
  if (confirmar && !confirm(dono ? "Você é o anfitrião. Sair encerra a partida para todos. Continuar?" : "Sair da sala? Você não poderá voltar.")) return;
  enviar({tipo:"sair_sala", _sala:c});
}
function pedirAbrir(){ S.querAbrir = true; S.erro = ""; }
function receber(m){
  const c = m.__sala;
  if (c && m.tipo === "erro" && !(c in R)) { S.querAbrir = false; aplicar(m); desenhar(); return; }
  if (!c) { if (m.tipo === "erro") S.querAbrir = false; aplicar(m); if (m.tipo === "deslogado"){ for (const k in R) delete R[k]; S.ativa = null; carregarFatia(null); servicoPartida(false); } desenhar(); return; }
  if (m.tipo === "abrir_sala"){ abrirSala(c); return; }
  if (m.tipo === "saiu_da_sala"){
    const eraAtiva = c === S.ativa; delete R[c];
    if (eraAtiva){ S.ativa = null; carregarFatia(null); S.tela = "menu"; }
    S.erro = m.motivo ? (eraAtiva ? "" : `Sala ${c}: `) + m.motivo : ""; servicoPartida(Object.keys(R).length > 0); desenhar(); return;
  }
  const nova = !(c in R); if (nova) R[c] = {};
  if (c === S.ativa){ aplicar(m); desenhar(); return; }
  const guarda = {tela:S.tela, erro:S.erro, ativa:S.ativa};
  salvarFatia(); S.ativa = c; carregarFatia(c); S.fundo = true;
  try { aplicar(m); } finally { salvarFatia(); S.fundo = false; S.ativa = guarda.ativa; carregarFatia(S.ativa); S.tela = guarda.tela; S.erro = guarda.erro; }
  if (nova && S.querAbrir && m.tipo === "sala"){ abrirSala(c); return; }
  desenhar();
}
function aplicar(m){
  switch(m.tipo){
    case "autenticado":
      S.iniciando = false; S.nome = m.nome; S.convidado = m.convidado; S.erro = "";
      if (S.tela === "login") S.tela = "menu";
      break;
    case "deslogado":
      S.iniciando = false; S.nome = null; S.sala = S.jogo = null; S.caderno = {}; S.historico = null;
      S.tela = "login"; S.cadernoAberto = false; S.juizOffline = false; S.vistoN = null; servicoPartida(false); break;
    case "juiz_offline": S.juizOffline = !!m.offline; S.juizSeg = m.segundos || 0; break;
    case "erro": S.erro = m.mensagem; break;
    case "cutucada":
      S.cutucada = {de:m.de, t:Date.now()}; avisar("vez", "🔔 " + m.de + " te cutucou", "É a sua vez de jogar!");
      if (!S.fundo){ Som.lembrete(); vibrar(); }
      break;
    case "sala":
      novidadesChat(m);
      S.sala = m; if (!S.fundo) S.erro = ""; servicoPartida(true);
      S.prazo = m.restam != null ? Date.now() + m.restam * 1000 : null;
      if (!m.iniciada){ S.jogo = null; S.caderno = {}; S.vistoN = null; S.acusando = false; S.alvo = null; S.anim = null; S.foco = null; S.zoom = 1; }
      S.tela = m.iniciada ? "jogo" : "lobby"; break;
    case "jogo":
      processarNovidades(m.visao); S.jogo = m.visao; S.tela = "jogo"; if (!S.fundo) agendarLembrete();
      if (!S.fundo && S.tut == null && ler("detetive_tut") !== "1") S.tut = 0;
      break;
    case "caderno": S.caderno = m.marcas || {}; break;
    case "historico": S.historico = m.partidas; break;
  }
}


/* ------------------------------------------------------------- som (sintetizado, sem arquivos) */
const Som = {
  ctx: null,
  pronto(){ if (!this.ctx){ try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } } if (this.ctx.state === "suspended") this.ctx.resume(); return this.ctx; },
  tom(f, dur, tipo = "sine", vol = .15, atraso = 0, f2 = null){
    if (!S.som) return; const c = this.pronto(); if (!c) return;
    try {
      const t0 = c.currentTime + atraso, o = c.createOscillator(), g = c.createGain();
      o.type = tipo; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + .02);
    } catch(e){}
  },
  dados(){ for (let i = 0; i < 7; i++) this.tom(180 + Math.random() * 260, .05, "square", .08, i * .07); this.tom(520, .12, "triangle", .1, .55); },
  passo(){ this.tom(220, .06, "triangle", .08); },

function processarNovidades(v){
  const prev = S.jogo, maxN = v.eventos.reduce((a,e)=>Math.max(a,e.n),0);
  if (S.vistoN == null){ S.vistoN = maxN; return; }
  const novos = v.eventos.filter(e=>e.n > S.vistoN); S.vistoN = Math.max(S.vistoN, maxN);
  const av = [];
  let sm = null;
  for (const e of novos){
    if (e.tipo === "dados") iniciarRolagem();
    if (e.tipo === "movimento" && prev && S.sala && !document.hidden){
      const antes = prev.jogadores.find(j => j.nome === e.jogador);
      if (antes && antes.posicao !== e.destino){ const pts = pontosAnim(S.sala, antes.posicao, e.destino); if (pts){ S.anim = {nome:e.jogador, pts, t0:performance.now()}; setTimeout(animarPeao, 0); } }
    }
    if (e.tipo === "dados") sm = sm || "dados"; else if (e.tipo === "movimento") sm = sm || "passo"; else if (e.tipo === "palpite") sm = "palpite"; else if (e.tipo === "carta_revelada" || e.tipo === "carta_mostrada") sm = "carta"; else if (e.tipo === "acusacao_errada") sm = "erro";
    if (e.tipo === "palpite" && e.jogador !== v.voce) av.push(["jogada", `🔎 ${e.jogador} palpitou`, `${e.suspeito} · ${e.local} · ${e.arma}`]);
    else if (e.tipo === "acusacao_errada" && e.jogador !== v.voce) av.push(["jogada", `⚖ ${e.jogador} acusou errado`, "Saiu do jogo."]);
    else if (e.tipo === "carta_revelada") av.push(["jogada", "👁 Você viu uma carta", `${e.carta} (de ${e.jogador})`]);
    else if (e.tipo === "convocado" && e.jogador === v.voce) av.push(["jogada", "↪ Você foi levado", `Para ${e.destino}, por causa de um palpite.`]);
  }
  const minhaVez = v.fase !== "fim" && v.vez_de === v.voce && (!prev || prev.vez_de !== v.voce || prev.fase === "fim");
  if (minhaVez) av.push(["vez", "🎯 É a sua vez!", "Role os dados e ande pelo mapa."]);
  if (v.aguardando_carta_de === v.voce && (!prev || prev.aguardando_carta_de !== v.voce) && v.palpite_atual)
    av.push(["vez", "🃏 Mostre uma carta", `${v.palpite_atual.jogador} palpitou: ${v.palpite_atual.suspeito}, ${v.palpite_atual.local}, ${v.palpite_atual.arma}.`]);
  if (v.fase === "fim" && (!prev || prev.fase !== "fim")) av.push(["jogada", "Caso encerrado", v.vencedor ? `${v.vencedor} venceu.` : "Ninguém resolveu."]);
  if (v.fase === "fim" && (!prev || prev.fase !== "fim")) sm = "fim";
  if (minhaVez) sm = "vez";
  if (sm) Som[sm]();
  av.slice(-3).forEach(a => avisar(a[0], a[1], a[2]));
  if (minhaVez) setTimeout(() => { if (S.jogo && S.sala && S.tela === "jogo" && S.jogo.vez_de === S.jogo.voce && S.jogo.fase !== "fim") focarMeuPeao(); }, 120);
  if (minhaVez || (v.aguardando_carta_de === v.voce && (!prev || prev.aguardando_carta_de !== v.voce))) vibrar();
}

/* ----------------------------------------------------------- caderno */

}
const marcaLocal = n => (S.tela === "jogo" && S.jogo) ? marcaDe(n).m : null;
function marcaDe(c){
  if (cartasSabidas().has(c)) return {m:"vista", auto:true};
  let m = S.caderno[c];
  if (m === "tenho" || m === "descartado") m = "vista";

}
const ehVista = c => marcaDe(c).m === "vista";
const ehSuspeita = c => marcaDe(c).m === "suspeita";

/* ---------------------------------------------------------- tabuleiro */
const SETAS = {dir:"→", esq:"←", baixo:"↓", cima:"↑"};
function emojiDe(s, personagem){ const i = s.cartas.suspeitos.indexOf(personagem); return (s.emojiSuspeitos && s.emojiSuspeitos[i]) || "🙂"; }
function quebra(nome){
  if (nome.length <= 10) return [nome];
  const m = nome.length / 2; let melhor = -1, d = 99;
  for (let i = 0; i < nome.length; i++) if (nome[i] === " " && Math.abs(i - m) < d){ d = Math.abs(i - m); melhor = i; }
  return melhor < 0 ? [nome] : [nome.slice(0, melhor), nome.slice(melhor + 1)];
}
/* ---- posição de um lugar no tabuleiro (em casas) ---- */
function posXY(s, lugar){
  const m = /^rua:(\d+):(\d+)$/.exec(lugar || "");
  if (m) return [+m[1] + .5, +m[2] + .5];
  const r = s.tabuleiro.salas.find(r => r.nome === lugar);
  return r ? [r.x0 + r.larg / 2, r.y0 + r.alt / 2] : [s.tabuleiro.tam / 2, s.tabuleiro.tam / 2];
}
/* Caminho mais curto (para mostrar antes de confirmar). Só vale para quem está na vez. */
function caminhoAte(s, v, destino){
  const eu = v.jogadores.find(j => j.nome === v.voce); if (!eu) return [];
  return caminhoEntre(s, eu.posicao, destino, new Set(v.jogadores.filter(j => j.nome !== v.voce && !j.eliminado).map(j => j.posicao)));
}
function caminhoEntre(s, origem, destino, ocupadas){
  const t = s.tabuleiro;
  const dentro = new Set(), entradas = {}, saidas = {};
  t.salas.forEach(r => {
    for (let dx = 0; dx < r.larg; dx++) for (let dy = 0; dy < r.alt; dy++) dentro.add((r.x0 + dx) + "," + (r.y0 + dy));
    entradas[`rua:${r.entrada.x}:${r.entrada.y}`] = r.nome; saidas[r.nome] = `rua:${r.saida.x}:${r.saida.y}`;
  });
  const viz = no => {
    if (saidas[no]) return [saidas[no]];
    const m = /^rua:(\d+):(\d+)$/.exec(no), x = +m[1], y = +m[2], out = [];
    for (const [a, b] of [[0,-1],[0,1],[-1,0],[1,0]]) { const nx = x + a, ny = y + b; if (nx >= 0 && ny >= 0 && nx < t.tam && ny < t.tam && !dentro.has(nx + "," + ny)) out.push(`rua:${nx}:${ny}`); }
    if (entradas[no]) out.push(entradas[no]);
    return out;
  };
  const ant = new Map([[origem, null]]); let fila = [origem];
  while (fila.length && !ant.has(destino)) {
    const prox = [];
    for (const no of fila) for (const w of viz(no)) {
      if (ant.has(w) || (!saidas[w] && ocupadas.has(w))) continue;

    fila = prox;
  }
  if (!ant.has(destino)) return [];
  const cam = []; for (let no = destino; no && no !== origem; no = ant.get(no)) cam.unshift(no);
  return cam;
}

/* Peão andando casa por casa. */
const PASSO_MS = 170;
function pontosAnim(s, origem, destino){
  const alt = l => { const r = s.tabuleiro.salas.find(r => r.nome === l); return r ? Predios.modelo(r.nome).alt + .05 : 0; };
  const pt = l => { const [x, y] = posXY(s, l); return [x, y, alt(l)]; };
  const cam = caminhoEntre(s, origem, destino, new Set());
  if (!cam.length) return null;
  return [pt(origem), ...cam.map(pt)];
}
function posicaoAnim(a){
  const t = (performance.now() - a.t0) / PASSO_MS, n = a.pts.length - 1;
  if (t >= n) return null;
  const i = Math.floor(t), f = t - i, p = a.pts[i], q = a.pts[i + 1];
  return [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f, p[2] + (q[2] - p[2]) * f + Math.sin(f * Math.PI) * .35];
}
function animarPeao(){
  const a = S.anim; if (!a) return;
  const passo = () => { if (S.anim !== a) return; redesenharMapa(); if (performance.now() - a.t0 >= (a.pts.length - 1) * PASSO_MS) { S.anim = null; redesenharMapa(); } else requestAnimationFrame(passo); };

function iniciarRolagem(){
  S.rolando = Date.now() + 1000; const fim = S.rolando;

/* ------------------------------------------ tabuleiro (3D com giro; 2D visto de cima) */

  const n = S.sala ? S.sala.tabuleiro.tam : 15;
  arrasto = {x: e.clientX, y: e.clientY, a: S.ang == null ? 45 : S.ang, el0: S.elev == null ? 32 : S.elev, f0: S.foco ? [...S.foco] : [n / 2, n / 2], n, mov: false, el, id: e.pointerId};
});
document.addEventListener("pointermove", e => {
  if (dedos.has(e.pointerId)) dedos.set(e.pointerId, [e.clientX, e.clientY]);
  if (pinca && dedos.size >= 2){
    const [p, q] = [...dedos.values()], d = Math.hypot(p[0] - q[0], p[1] - q[1]);
    S.zoom = limZoom(pinca.z * d / pinca.d); redesenharMapa(); return;
  }
  if (!arrasto) return;
  const dx = e.clientX - arrasto.x, dy = e.clientY - arrasto.y;
  if (!arrasto.mov && Math.hypot(dx, dy) > 6){ arrasto.mov = true; animCam++; try { arrasto.el.setPointerCapture(arrasto.id); } catch(x){} }
  if (!arrasto.mov) return;
  if (S.vista3d){
    if (S.fixo) return;
    S.ang = (((arrasto.a - dx * 0.7) % 360) + 360) % 360;
    S.elev = Math.max(15, Math.min(90, arrasto.el0 + dy * 0.35));
  } else {
    const W = arrasto.el.clientWidth || 360, k = 380 / W / (22 * (S.zoom || 1)), n = arrasto.n;
    S.foco = [Math.max(0, Math.min(n, arrasto.f0[0] - dx * k)), Math.max(0, Math.min(n, arrasto.f0[1] - dy * k))];
  }
  redesenharMapa();
});
document.addEventListener("wheel", e => {
  if (!(e.target.closest && e.target.closest("[data-rot]"))) return;
  e.preventDefault(); S.zoom = limZoom((S.zoom || 1) * (e.deltaY < 0 ? 1.12 : 1 / 1.12)); redesenharMapa();
}, {passive:false});
const fimArrasto = e => { if (e && e.pointerId != null){ dedos.delete(e.pointerId); if (dedos.size < 2 && pinca){ pinca = null; arrastou = true; setTimeout(() => { arrastou = false; }, 120); } } if (arrasto && arrasto.mov){ arrastou = true; setTimeout(() => { arrastou = false; }, 80); } arrasto = null; };
document.addEventListener("pointerup", fimArrasto); document.addEventListener("pointercancel", fimArrasto);

function ultimaJogada(v, s){
  const ev = v.eventos; let i = -1;
  for (let k = ev.length - 1; k >= 0; k--) if (["palpite","acusacao_certa","acusacao_errada"].includes(ev[k].tipo)) { i = k; break; }
  if (i < 0) return "";
  const e = ev[i], quem = x => x === v.voce ? "Você" : esc(x);
  if (e.tipo !== "palpite") {
    const certo = e.tipo === "acusacao_certa";
    return `<div class="card jogada"><div class="quem">⚖ ${quem(e.jogador)} ${certo ? "acusou e acertou" : "acusou e errou"}</div>
      ${certo ? `<div class="trio"><span>${esc(e.suspeito)}</span><span>📍 ${esc(e.local)}</span><span>🔪 ${esc(e.arma)}</span></div>` : ""}</div>`;
  }
  const res = ev.slice(i + 1).map(x => {
    if (x.tipo === "convocado") return `<p>↪ ${esc(x.personagem)} foi levado para ${esc(x.destino)}.</p>`;
    if (x.tipo === "sem_carta") return `<p>✖ ${quem(x.jogador)} não tem nenhuma dessas cartas.</p>`;
    if (x.tipo === "carta_mostrada") { if (x.jogador === v.voce) return ""; return `<p>✔ ${quem(x.jogador)} mostrou uma carta${x.para === v.voce ? " para você" : " para " + esc(x.para)}.</p>`; }
    if (x.tipo === "carta_que_mostrei") return `<p class="vi">🃏 Você mostrou: <b>${esc(x.carta)}</b> para ${esc(x.para)}</p>`;
    if (x.tipo === "carta_revelada") return `<p class="vi">👁 Você viu: <b>${esc(x.carta)}</b> (de ${esc(x.jogador)})</p>`;
    if (x.tipo === "ninguem_refutou") return `<p class="vi">⚠ Ninguém tinha nenhuma dessas cartas!</p>`;
    return "";
  }).join("");
  const espera = v.fase === "refutando" ? `<p>⏳ Aguardando ${quem(v.aguardando_carta_de)} mostrar uma carta…</p>` : "";
  return `<div class="card jogada"><div class="quem">🔎 ${quem(e.jogador)} ${e.jogador === v.voce ? "palpitou" : "palpitou"}</div>
    <div class="trio"><span>${emojiDe(s, e.suspeito)} ${esc(e.suspeito)}</span><span>📍 ${esc(e.local)}</span><span>🔪 ${esc(e.arma)}</span></div>
    <div class="res">${res}${espera}</div></div>`;
}

/* ------------------------------------------- painéis (caderno, chat, palpites) */
function resumoPalpites(){
  const v = S.jogo, ev = v.eventos, lista = [];
  let atual = null;
  for (const e of ev){
    if (e.tipo === "palpite"){ atual = {n:e.n, jogador:e.jogador, suspeito:e.suspeito, local:e.local, arma:e.arma, resp:[]}; lista.push(atual); }
    else if (!atual) continue;
    else if (e.tipo === "sem_carta") atual.resp.push(`${e.jogador}: não tinha nenhuma`);
    else if (e.tipo === "carta_mostrada") { if (e.jogador !== v.voce) atual.resp.push(`${e.jogador} mostrou uma carta${e.para === v.voce ? "" : " para " + e.para}`); }
    else if (e.tipo === "carta_que_mostrei") atual.resp.push(`🃏 Você mostrou: ${e.carta} para ${e.para}`);
    else if (e.tipo === "carta_revelada") atual.resp.push(`👁 Você viu: ${e.carta}`);
    else if (e.tipo === "ninguem_refutou") atual.resp.push("Ninguém refutou!");
    else if (e.tipo === "vez_de") atual = null;
  }
  return lista.reverse();
}
function painel(){

      <div class="trio" style="margin:8px 0"><span>${esc(p.suspeito)}</span><span>📍 ${esc(p.local)}</span><span>🔪 ${esc(p.arma)}</span></div>
      ${p.resp.map(r=>`<small style="display:block">• ${esc(r)}</small>`).join("")}</div>`).join("") : "<div class='card'><small>Ninguém palpitou ainda.</small></div>");
  } else {
    const lista = (S.sala.chat || []), fr = S.sala.frases || [];
    corpo = `<h2 style="margin-top:0">Chat rápido</h2><div class="card" style="min-height:120px">${lista.length ? lista.map(c=>`<div class="bolha ${c.de===S.nome?"eu":""}"><b>${c.de===S.nome?"Você":esc(c.de)}</b>${esc(fr[c.i]||"")}</div>`).join("") : "<small>Nenhuma mensagem. Toque numa frase abaixo.</small>"}</div>
      <small>Toque para enviar:</small><div class="frases">${fr.map((f,i)=>`<button onclick="falar(${i})">${esc(f)}</button>`).join("")}</div>`;
    S.chatLido = S.chatVisto || 0;
  }
  const nav = abas.length > 1 ? abas.map(a=>`<button class="${a===S.painel?"on":""}" onclick="abrirPainel('${a}')">${rot[a]}</button>`).join("") : `<b style="flex:1;font-size:18px">${rot[S.painel]}</b>`;
  return `<div class="painel ${cls}" id="painel"><div class="in"><div class="pnav">${nav}<button class="x" onclick="fecharPainel()" aria-label="Voltar ao jogo">✕ ${emJogo?"Jogo":"Fechar"}</button></div>${corpo}</div></div>`;

function fimDeJogo(){

  const jogadas = ev.filter(e => e.tipo === "dados").length;
  const linhas = v.jogadores.map(j => {
    const res = j.nome === v.vencedor ? "🏆" : (ev.some(e => e.tipo === "acusacao_errada" && e.jogador === j.nome) ? "❌ acusou errado" : (j.saiu || j.eliminado ? "saiu" : "—"));
    return `<tr><td>${emojiDe(s, j.personagem)} ${esc(j.nome)}${j.nome===v.voce?" (você)":""}</td><td>${conta("palpite", j.nome)}</td><td>${conta("carta_mostrada", j.nome)}</td><td>${res}</td></tr>`;
  }).join("");
  const maisPal = [...v.jogadores].sort((a, b) => conta("palpite", b.nome) - conta("palpite", a.nome))[0];
  const totalPal = ev.filter(e => e.tipo === "palpite").length;
  return painel() + `<div class="fim"><h1>${venceu?"Caso resolvido!":"Caso encerrado"}</h1>
  <div class="big">${v.vencedor?`${esc(v.vencedor)} ${venceu?"(você) ":""}venceu`:"Ninguém resolveu"}</div>
  <div class="card"><small>A verdade</small><div class="trio" style="justify-content:center;margin-top:8px">${v.solucao?`<span>${emojiDe(s, v.solucao[0])} ${esc(v.solucao[0])}</span><span>📍 ${esc(v.solucao[1])}</span><span>🔪 ${esc(v.solucao[2])}</span>`:""}</div></div>
  <div class="card" style="text-align:left"><h2 style="margin-top:0">Resumo da partida</h2>
    <small>${jogadas} ${jogadas===1?"jogada":"jogadas"} · ${totalPal} ${totalPal===1?"palpite":"palpites"}${totalPal && maisPal ? ` · quem mais palpitou: ${esc(maisPal.nome)}` : ""}</small>
    <table class="res"><tr><th>Jogador</th><th>Palpites</th><th>Cartas mostradas</th><th>Resultado</th></tr>${linhas}</table></div>
  ${souDono ? `<button class="main" style="width:100%;margin-bottom:8px" onclick="enviar({tipo:'revanche'})">🔁 Jogar de novo (revanche)</button>` : `<p class="sub">Se ${esc(s.anfitriao)} quiser, a revanche começa aqui.</p>`}
  <div class="row" style="margin-bottom:8px">${botaoPainel("chat","💬 Chat")}${botaoPainel("palpites","🔎 Palpites")}</div>
  <div class="row"><button class="ghost" onclick="irInicio()">🏠 Início</button><button class="ghost" onclick="sairDaSala(S.ativa,false)">Sair da sala</button></div></div>`;
}

/* ------------------------------------------- lembrete de encerrar a jogada */
let lembreteTimer = null, lembreteChave = "";
function botaoCutucar(v, s, euVez, eliminado){
  if (euVez || eliminado || v.fase === "fim") return "";
  const alvo = (s.jogadores || []).find(j => j.nome === v.vez_de); if (!alvo || alvo.bot) return "";
  const espera = Date.now() - S.cutucouEm < 30000;
  return `<button class="ghost" style="width:100%;margin:6px 0" ${espera?"disabled":""} onclick="cutucar()">${espera ? "✓ Cutucada enviada" : "🔔 Cutucar " + esc(v.vez_de)}</button>`;
}
function agendarLembrete(){
  const v = S.jogo, ativo = !!v && v.vez_de === v.voce && v.fase === "pos_palpite", chave = ativo ? v.eventos.length + ":" + v.fase : "";
  if (chave === lembreteChave) return;
  lembreteChave = chave; clearTimeout(lembreteTimer); S.lembrando = false;
  if (!ativo) return;
  let vezes = 0;
  const bater = () => {
    const w = S.jogo; if (!(w && w.vez_de === w.voce && w.fase === "pos_palpite")) return;
    S.lembrando = true; Som.lembrete(); vibrar(); avisar("vez", "⏰ Encerre a sua jogada", "Toque em “Encerrar a vez” para passar para o próximo."); desenhar();
    if (++vezes < 3) lembreteTimer = setTimeout(bater, 25000);
  };
  lembreteTimer = setTimeout(bater, 20000);
}

/* ----------------------------------------------------------------- tutorial */
const PASSOS_TUT = [
  {ic:"🔎", t:"O crime", p:"Alguém cometeu um crime. Descubra QUEM foi, ONDE e COM QUÊ. Ganha quem acusar certo."},
  {ic:"🎲", t:"Sua vez", p:"Role os 2 dados. Você anda essa quantidade de casas. Casas claras: pode ir. Casas escuras: não pode."},
  {ic:"👆", t:"Andar", p:"Toque numa casa clara: aparece o caminho. Toque de novo para andar. Entrar num local termina o movimento."},
  {ic:"🗺", t:"O mapa", p:"Arraste para girar e inclinar. Pinça para aproximar. Botões: 🎯 seu peão, 🗺 mapa todo, 🌙 noite."},
  {ic:"🕵", t:"Palpite", p:"Dentro de um local, escolha suspeito e arma. Os outros mostram uma carta se tiverem. O suspeito vai para o local."},
  {ic:"📓", t:"Caderno", p:"Marque as cartas: Vista, Suspeita, Pensando. As vistas somem das opções. Chat e palpites ficam nos botões."},
  {ic:"⚖", t:"Acusação", p:"Tem certeza? Acuse! Se acertar, você vence. Se errar, sai do jogo. Boa sorte, detetive!"},
];
function tutorialHtml(){
  if (S.tut == null) return "";
  const i = S.tut, p = PASSOS_TUT[i], ult = i === PASSOS_TUT.length - 1;
  return `<div class="tut" role="dialog" aria-label="Como jogar"><div class="cx"><div class="ic">${p.ic}</div><h2>${p.t}</h2><p>${p.p}</p>
    <div class="pts">${PASSOS_TUT.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
    <div class="row">${i > 0 ? `<button onclick="passoTutorial(-1)">← Voltar</button>` : `<button class="ghost" onclick="fecharTutorial()">Pular</button>`}<button class="main" onclick="${ult ? "fecharTutorial()" : "passoTutorial(1)"}">${ult ? "Entendi!" : "Próximo →"}</button></div></div></div>`;
}
function abrirTutorial(){ S.tut = 0; desenhar(); }
function passoTutorial(d){ S.tut = Math.max(0, Math.min(PASSOS_TUT.length - 1, (S.tut || 0) + d)); desenhar(); }
function fecharTutorial(){ S.tut = null; guardar("detetive_tut", "1"); desenhar(); }

/* ----------------------------------------------------- atualização do app */
function bannerAtualizacao(){
  const a = S.atual;
  if (!a) return "";
  const prog = S.atualizando ? (S.pct != null && S.pct >= 0 ? `Baixando… ${S.pct}%` : "Baixando…") : "⬇ Atualizar agora";
  return `<div class="card" style="border-color:var(--red)"><b>🔄 Nova versão ${esc(a.versao)}</b>
    ${a.notas ? `<div><small>${esc(a.notas).replace(/\n/g,"<br>")}</small></div>` : ""}
    ${S.erroAtual ? `<div class="err">${esc(S.erroAtual)}</div>` : ""}
    <button class="main" style="width:100%;margin-top:8px" ${S.atualizando?"disabled":""} onclick="atualizarApp()">${prog}</button></div>`;
}
function atualizarApp(){ S.atualizando = true; S.pct = null; S.erroAtual = ""; desenhar(); window.AndroidApp.instalar(S.atual.url); }
window.__atualizacao = o => { S.atual = o; desenhar(); };
window.__progressoAtualizacao = p => { S.pct = p; desenhar(); };
window.__fimAtualizacao = erro => { S.atualizando = false; S.erroAtual = erro || ""; desenhar(); };

/* ----------------------------------------------------------- ações */
function aba(a){ S.aba = a; S.erro = ""; desenhar(); }
function entrarConta(){ S.erro=""; enviar({tipo:"entrar", usuario:val("usuario"), senha:val("senha")}); }
function cadastrar(){ S.erro=""; enviar({tipo:"registrar", usuario:val("usuario"), senha:val("senha")}); }
function entrarConvidado(){ S.erro=""; enviar({tipo:"convidado", apelido:val("apelido")}); }
function entrarSala(){ pedirAbrir(); enviar({tipo:"entrar_sala", codigo:val("codigo")}); }
function sair(){ S.erro = ""; enviar({tipo:"sair_conta"}); }
function mover(d){ S.erro=""; S.alvo=null; enviar({tipo:"mover", destino:d}); }
function sel(campo, c){ S.sel[campo]=c; desenhar(); }
function assumir(){ if (!confirm("Assumir a partida? Seu celular passa a ser o juiz e precisa ficar com o app aberto.")) return; enviar({tipo:"assumir"}); }
function cutucar(){ S.cutucouEm = Date.now(); enviar({tipo:"cutucar"}); setTimeout(desenhar, 30500); desenhar(); }
function palpitar(){ enviar({tipo:"palpitar", suspeito:S.sel.suspeito, arma:S.sel.arma}); S.sel={suspeito:null,arma:null}; S.blefe=false; }
function acusar(){
  const a = S.acus;
  if (!confirm(`Acusar ${a.suspeito}, em ${a.local}, com ${a.arma}? Se errar, você sai do jogo.`)) return;
  enviar({tipo:"acusar", suspeito:a.suspeito, local:a.local, arma:a.arma});
  S.acusando = false; S.acus = {suspeito:null,local:null,arma:null};
}
function marcar(c, m){
  if (marcaDe(c).auto) return;
  const novo = Object.assign({}, S.caderno), atual = marcaDe(c).m;
  if (atual === m) delete novo[c]; else novo[c] = m;
  S.caderno = novo; desenhar();
  enviar({tipo:"caderno", marcas:novo});
}

window.__receberDoServidor = m => receber(typeof m === "string" ? JSON.parse(m) : m);
document.addEventListener("visibilitychange", () => { if (!document.hidden && T && S.nome) T.enviar({tipo:"retomar"}); });
try { lerConvite(new URLSearchParams(location.search).get('sala')); } catch(e){}
aplicarTema(); conectar(); desenhar(); window.__verConvite();
if (window.AndroidApp) { try { window.AndroidApp.verificar(); } catch(e){} }
</script>
